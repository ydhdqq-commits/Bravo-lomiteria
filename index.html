<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRAVO / Lomiteria - Nueva Cordoba</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#080808;color:#eee;font-family:system-ui,sans-serif}
.top{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;padding:18px 24px;font-size:10px;letter-spacing:.35em;z-index:30;background:rgba(0,0,0,.9);border-bottom:1px solid #1a1a1a}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:90px 8vw 40px;overflow:hidden}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(0,0,0,.2),#000 88%);z-index:1}
.hero-content{position:relative;z-index:2;max-width:650px}.hero h1{font-size:15vw;line-height:.85;font-weight:900;letter-spacing:-.04em}
.hero h1 i{font-family:Georgia,serif;font-style:italic;font-weight:300;color:#ff3c00}.hero p{margin-top:18px;color:#aaa;line-height:1.6;font-size:16px}
.btn{display:inline-block;margin-top:26px;padding:16px 32px;background:#ff3c00;color:#fff;text-decoration:none;font-size:11px;letter-spacing:.2em;font-weight:700}
.sec{position:relative;min-height:70vh;padding:80px 8vw;border-top:1px solid #111;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.sec video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45;filter:brightness(.8) contrast(1.15)}
.sec::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000 28%,rgba(0,0,0,.45) 100%);z-index:1}
.sec > *{position:relative;z-index:2}.k{font-size:10px;letter-spacing:.45em;color:#ff3c00;margin-bottom:14px;font-weight:700}
.sec h3{font-size:36px;font-weight:800;margin-bottom:10px;line-height:.9}.sec p{color:#999;max-width:520px;line-height:1.6;font-size:15px}
.price{margin-top:10px;color:#ff3c00;font-weight:700;font-size:13px;letter-spacing:.1em}
.info{padding:80px 8vw;display:grid;grid-template-columns:1fr 1fr;gap:40px;background:#0e0e0e;border-top:1px solid #111}
.info h4{font-size:11px;letter-spacing:.4em;color:#ff3c00;margin-bottom:18px}.info p{color:#888;line-height:1.8;font-size:14px}
.info a{color:#eee;text-decoration:none}.info a:hover{color:#ff3c00}
.map{height:420px;filter:grayscale(1) invert(.9) contrast(1.2);border-top:1px solid #111}
.map iframe{width:100%;height:100%;border:0}
.footer{padding:40px 8vw;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.3em;color:#444;border-top:1px solid #111}
